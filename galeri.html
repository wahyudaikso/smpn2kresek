<!DOCTYPE html>
<html>
<head>
<title>Galeri</title>
</head>
<style>

body{
font-family:Arial, sans-serif;
background:#f5f7fa;
margin:0;
}

.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.title{
text-align:center;
color:#0d47a1;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
transition:0.3s;
}

.card:hover img{
transform:scale(1.05);
}

.card h3{
padding:15px;
margin:0;
color:#0d47a1;
}

a{
text-decoration:none;
color:inherit;
}

</style>
<body>
<header style="
background:#0d47a1;
padding:15px 40px;
display:flex;
align-items:center;
justify-content:space-between;
position:fixed;
top:0;
left:0;
width:100%;
z-index:1000;
">

<div style="display:flex;align-items:center;gap:12px;">
<img src="logo.png" style="width:55px;">
<div>
<h2 style="color:white;margin:0;">SMP Negeri 2 Kresek</h2>

</div>
</div>

<a href="galeri.html" style="color:white;text-decoration:none;">Galeri</a>
<a href="index.html#kontak" style="color:white;text-decoration:none;">Kontak</a>
</nav>

</header>

<div class="container">
