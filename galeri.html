<!DOCTYPE html>
<html>
<head>
<title>Galeri</title>
</head>
<style>

body{
font-family:Arial, sans-serif;
background:#f5f7fa;
margin:0;
}

.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.title{
text-align:center;
color:#0d47a1;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
gap:25px;
}

.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:180px;
object-fit:cover;
transition:0.3s;
}

.card:hover img{
transform:scale(1.05);
}

.card h3{
padding:15px;
margin:0;
color:#0d47a1;
}

a{
text-decoration:none;
color:inherit;
}

</style>
<body>
<div class="container">

<h1 class="title">Galeri Kegiatan</h1>

<div class="grid">

<a href="ramadhan.html">
<div class="card">

<img src="ramadhan1.jpg">

<h3>Kegiatan Ramadhan 2026</h3>

</div>
</a>

</div>

</div>
<h1 style="text-align:center;">Galeri Kegiatan</h1>

<div style="
display:grid;
grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
gap:20px;
padding:20px;
">

<a href="ramadhan.html" style="text-decoration:none;color:black;">
<div style="
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
">

<img src="ramadhan1.jpg" style="width:100%;height:180px;object-fit:cover;">
<img src="ramadhan2.jpg" style="width:100%;height:180px;object-fit:cover;">
<img src="ramadhan3.jpg" style="width:100%;height:180px;object-fit:cover;">
<img src="ramadhan4.jpg" style="width:100%;height:180px;object-fit:cover;">

<h3 style="padding:15px;">Kegiatan Ramadhan 2026</h3>

</div>
</a>

</div>

</body>
</html>
