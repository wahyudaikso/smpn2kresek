<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Data Siswa</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body{
      font-family:Arial;
      background:#f1f5f9;
      margin:0;
    }

    .container{
      max-width:1000px;
      margin:50px auto;
      background:white;
      padding:40px;
      border-radius:12px;
      text-align:center;
    }

    .tahun-grid{
      display:flex;
      gap:20px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:30px;
    }

    .tahun-card{
      background:#f1f5f9;
      padding:25px 40px;
      border-radius:12px;
      text-decoration:none;
      color:#1e3a8a;
      font-weight:bold;
      transition:0.3s;
    }

    .tahun-card:hover{
      background:#2563eb;
      color:white;
      transform:translateY(-5px);
    }

    .btn-kembali{
      display:inline-block;
      margin-top:30px;
      padding:10px 20px;
      background:#1e4fa3;
      color:white;
      border-radius:8px;
      text-decoration:none;
    }
  </style>

</head>

<body>
<header style="
background:#0d47a1;
padding:15px 40px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:1000;
">

<div style="display:flex;align-items:center;gap:12px;">
<img src="logo.png" style="width:55px;">

<div>
<h2 style="color:white;margin:0;">SMP Negeri 2 Kresek</h2>
<small style="color:#cfd8ff;">Kabupaten Tangerang</small>
</div>
</div>

<nav style="display:flex;gap:25px;font-weight:bold;">
<a href="index.html#beranda">Beranda</a>
<a href="index.html#profil">Profil</a>
<a href="index.html#guru">Guru</a>
<a href="index.html#berita">Berita</a>
<a href="galeri.html">Galeri</a>
<a href="index.html#kontak">Kontak</a>
</nav>

</header>

<div class="container">

  <h2>Data Siswa</h2>
  <p>Pilih Tahun Ajaran</p>
<canvas id="chartSiswa" style="max-width:900px; margin:40px auto;"></canvas>
  
  <div class="tahun-grid">

    <a href="data-2023.html" class="tahun-card">
      2023/2024
    </a>

    <a href="data-2024.html" class="tahun-card">
      2024/2025
    </a>

    <a href="data-2025.html" class="tahun-card">
      2025/2026
    </a>

  </div>

  <a href="index.html" class="btn-kembali">
    ← Kembali ke Beranda
  </a>

</div>
  
<script>
const ctx = document.getElementById('chartSiswa').getContext('2d');

new Chart(ctx, {
    type: 'line',
    datasets: [{
    label: 'Jumlah Siswa',
    data: [450, 500, 480, 530, 600],
    borderColor: '#0d47a1',
    backgroundColor: 'rgba(13,71,161,0.15)',
    tension: 0.4,
    fill: true,
    pointRadius: 6,
    pointHoverRadius: 8,
    pointBackgroundColor: '#0d47a1',
    borderWidth: 3
}]
    },
 options: {
  animation: {
    x: {
      type: 'number',
      easing: 'linear',
      duration: 1500,
      from: 0
    },
    y: {
      type: 'number',
      easing: 'easeOutQuart',
      duration: 1500
    }
  },
  plugins: {
    legend: {
      labels: {
        font: {
          size: 14,
          weight: 'bold'
        }
      }
    }
  },
  scales: {
    y: {
      beginAtZero: true,
      ticks: {
        stepSize: 50
      }
    }
  }
}
  interaction: {
  mode: 'index',
  intersect: false
},
});
</script>
</body>
</html>
