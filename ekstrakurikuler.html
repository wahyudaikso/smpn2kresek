<!DOCTYPE html>
<html>
<head>
<title>Ekstrakurikuler</title>

<style>
body{
  font-family:Arial;
  padding-top:100px;
  background:#f5f7fa;
}

.title{
  text-align:center;
  color:#0d47a1;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card h3{
  padding:15px;
  margin:0;
  color:#0d47a1;
}

a{
  text-decoration:none;
  color:inherit;
}
</style>

</head>

<body>

<h1 class="title">Ekstrakurikuler</h1>

<div class="grid">

<!-- FUTSAL (SUDAH ADA) -->
<a href="futsal.html">
  <div class="card">
    <img src="futsal1.jpg">
    <img src="futsal2.jpg">
    <img src="futsal3.jpg">
    <img src="futsal4.jpg">
    <img src="futsal5.jpg">
    <img src="futsal6.jpg">
    <img src="futsal7.jpg">
    <img src="futsal8.jpg">
    <img src="futsal9.jpg">
    <img src="futsal10.jpg">
    <img src="futsal11.jpg">
    <img src="futsal12.jpg">
    <h3>Futsal</h3>
  </div>
</a>

<!-- PRAMUKA -->
<a href="#">
  <div class="card">
    <img src="foto.jpg">
    <h3>Pramuka</h3>
  </div>
</a>

<!-- HADROH -->

  </div>
</a>

<!-- PMR -->

</html>
