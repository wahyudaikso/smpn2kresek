<!DOCTYPE html>
<html>
<head>
<title>Ekstrakurikuler</title>

<style>
body{
font-family:Arial, sans-serif;
background:#f5f7fa;
margin:0;
}

/* NAVBAR */
header{
background:#0d47a1;
padding:12px 30px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

header img{
width:45px;
}

header h2{
color:white;
margin:0;
font-size:18px;
}

header small{
color:#cfd8ff;
font-size:11px;
}

nav{
display:flex;
gap:20px;
}

nav a{
color:white;
text-decoration:none;
font-weight:500;
}

/* CONTAINER */
.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

/* TITLE */
.title{
text-align:center;
color:#0d47a1;
margin-bottom:40px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(280px,1fr));
gap:25px;
}

/* CARD */
.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,0.1);
transition:0.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
width:100%;
height:200px;
object-fit:cover;
transition:0.3s;
}

.card:hover img{
transform:scale(1.05);
}

.card h3{
padding:15px;
margin:0;
color:#0d47a1;
}

.card-link{
display:block;
}

/* LINK */
a{
text-decoration:none;
color:inherit;
}

.back-button{
text-align:center;
margin:50px 0;
}

.back-button a{
display:inline-block;
background:#0d47a1;
color:white;
padding:12px 30px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
font-size:14px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:0.3s;
}

.back-button a:hover{
background:#1565c0;
transform:translateY(-3px);
}

.back-button a:active{
transform:scale(0.97);
}

</style>

</head>

<body>
