<!DOCTYPE html>
<html>
<head>
<title>Ekstrakurikuler</title>

<style>
body{
  font-family:Arial;
  padding-top:100px;
  background:#f5f7fa;
}

.title{
  text-align:center;
  color:#0d47a1;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card h3{
  padding:15px;
  margin:0;
  color:#0d47a1;
}

a{
  text-decoration:none;
  color:inherit;
}
  .back-button {
  text-align: center;
  margin-top: 40px;
}

.back-button a {
  display: inline-block;
  background: #0d47a1;
  color: white;
  padding: 12px 28px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  transition: 0.3s;
}

.back-button a:hover {
  background: #1565c0;
  transform: translateY(-3px);
}
</style>

</head>

<body>

<h1 class="title">Ekstrakurikuler</h1>

<div class="grid">

  </div>
</a>
