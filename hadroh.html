<!DOCTYPE html>
<html>
<head>
  <title>Ekstrakurikuler</title>
<style>
/* NAVBAR */
header{
background:#0d47a1;
padding:12px 30px;
display:flex;
align-items:center;
justify-content:space-between;
position:sticky;
top:0;
z-index:1000;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

header img{
width:45px;
}

header h2{
color:white;
margin:0;
font-size:18px;
}

header small{
color:#cfd8ff;
font-size:11px;
}

nav{
display:flex;
gap:20px;
}

nav a{
color:white;
text-decoration:none;
font-weight:500;
}

/* BODY */
body{
font-family:Arial, sans-serif;
margin:0;
background:#f5f7fa;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
padding:20px;
}

.grid{
margin-top:30px;
}

.grid img{
width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
cursor:pointer;
transition:0.3s;
}

.grid img:hover{
transform:scale(1.05);
}

.title{
  text-align:center;
  color:#0d47a1;
  margin-bottom:30px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card h3{
  padding:15px;
  margin:0;
  color:#0d47a1;
}

a{
  text-decoration:none;
  color:inherit;
}

.title{
font-size:28px;
font-weight:bold;
}

.back-button{
text-align:center;
margin:40px 0;
}

.back-button a{
display:inline-block;
background:#0d47a1;
color:white;
padding:12px 28px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
font-size:14px;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
transition:0.3s;
}

.back-button a:hover{
background:#1565c0;
transform:translateY(-3px);
}

.back-button a:active{
transform:scale(0.97);
}
</style>

</head>
<body>

<header>
<div style="display:flex;align-items:center;gap:10px;">
<img src="logo.png">

<div>
<h2>SMP Negeri 2 Kresek</h2>
<small>Kabupaten Tangerang</small>
</div>
</div>

<nav>
<a href="index.html">Beranda</a>
<a href="index.html#profil">Profil</a>
<a href="index.html#guru">Guru</a>
<a href="index.html#berita">Berita</a>
<a href="galeri.html">Galeri</a>
<a href="index.html#kontak">Kontak</a>
</nav>
</header>

<h1 class="title">Hadroh</h1>

<div class="grid">

<img src="hadroh1.jpg" class="fade-in" onclick="openImg(0)">
<img src="hadroh2.jpg" class="fade-in" onclick="openImg(1)">
<img src="hadroh3.jpg" class="fade-in" onclick="openImg(2)">
<img src="hadroh4.jpg" class="fade-in" onclick="openImg(3)">
<img src="hadroh5.jpg" class="fade-in" onclick="openImg(4)">
<img src="hadroh6.jpg" class="fade-in" onclick="openImg(5)">
<img src="hadroh7.jpg" class="fade-in" onclick="openImg(6)">
<img src="hadroh8.jpg" class="fade-in" onclick="openImg(7)">
</div>
<div class="back-button">
  <a href="ekstrakurikuler.html">← Kembali ke Ekstrakurikuler</a>
</div>
<div id="lightbox" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
justify-content:center;
align-items:center;
z-index:9999;
">

<!-- tombol close -->
<span onclick="closeImg()" style="
position:absolute;
top:20px;
right:30px;
font-size:30px;
color:white;
cursor:pointer;
">&times;</span>

<!-- tombol kiri -->
<span onclick="prevImg(event)" style="
position:absolute;
left:20px;
top:50%;
transform:translateY(-50%);
font-size:40px;
color:white;
cursor:pointer;
">&#10094;</span>

<!-- gambar -->
<img id="lightbox-img" style="
max-width:90vw;
max-height:90vh;
object-fit:contain;
border-radius:12px;
box-shadow:0 20px 60px rgba(0,0,0,0.7);
display:block;
margin:auto;
">

<!-- tombol kanan -->
<span onclick="nextImg(event)" style="
position:absolute;
right:20px;
top:50%;
transform:translateY(-50%);
font-size:40px;
color:white;
cursor:pointer;
">&#10095;</span>

</div>
<script>
let images = [
 "hadroh1.jpg",
 "hadroh2.jpg",
 "hadroh3.jpg",
 "hadroh4.jpg",
 "hadroh5.jpg",
 "hadroh6.jpg",
 "hadroh7.jpg",
 "hadroh8.jpg"
];

let currentIndex = 0;

function openImg(index){
 currentIndex = index;
 document.getElementById("lightbox").style.display = "flex";
 document.getElementById("lightbox-img").src = images[currentIndex];
}

function closeImg(){
 document.getElementById("lightbox").style.display = "none";
}

function nextImg(e){
 e.stopPropagation();
 currentIndex = (currentIndex + 1) % images.length;
 document.getElementById("lightbox-img").src = images[currentIndex];
}

function prevImg(e){
 e.stopPropagation();
 currentIndex = (currentIndex - 1 + images.length) % images.length;
 document.getElementById("lightbox-img").src = images[currentIndex];
}
</script>
</body>
</html>
