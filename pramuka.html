  <style>
header{
  background:#0d47a1;
  padding:15px 40px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  z-index:1000;
}
body {
    font-family: Arial;
    padding-top: 100px;
    background: linear-gradient(to bottom, #f5f7fa, #e4ecf7);
}
.title{
  text-align:center;
  color:#0d47a1;
  margin-bottom:30px;
}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}
.grid img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:10px;
  cursor:pointer;
  transition:0.3s;
}
.grid img {
  transition: 0.3s ease;
  cursor: pointer;
  border-radius: 12px;
}

.grid img:hover {
  transform: scale(1.05);
}
.grid {
  margin-top: 30px;
}
    
#lightbox img {
    animation: zoomIn 0.3s ease;
}

@keyframes zoomIn {
    from {
        transform: scale(0.8);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}
    .back-button {
  text-align: center;
  margin-top: 40px;
}

.back-button a {
  display: inline-block;
  background: #0d47a1;
  color: white;
  padding: 12px 28px;
  border-radius: 30px;
  text-decoration: none;
  font-weight: bold;
  font-size: 14px;

  /* 🔥 efek */
  box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  transition: 0.3s;
}

.back-button a:hover {
  background: #1565c0;
  transform: translateY(-3px);
}
    .back-button a:active {
  transform: scale(0.97);
}
  </style>

<style>
body{
  font-family:Arial;
  padding-top:100px;

}

.title{
  text-align:center;
  color:#0d47a1;

.grid{
  display:grid;

  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);

}

  padding:15px;
  margin:0;
  color:#0d47a1;
}

a{
  text-decoration:none;
  color:inherit;
}
</style>

</head>

<body style="padding-top:100px;">

<h1 class="title">Pramuka</h1>

<div class="grid">

<img src="pramuka1.jpg" class="fade-in" onclick="openImg(0)">
<img src="pramuka2.jpg" class="fade-in" onclick="openImg(1)">
<img src="pramuka3.jpg" class="fade-in" onclick="openImg(2)">
<img src="pramuka4.jpg" class="fade-in" onclick="openImg(3)">

</div>
<div class="back-button">
  <a href="ekstrakurikuler.html">← Kembali ke Ekstrakurikuler</a>
</div>
<div id="lightbox" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
justify-content:center;
align-items:center;
z-index:9999;
">

<!-- tombol close -->
<span onclick="closeImg()" style="
position:absolute;
top:20px;
right:30px;
font-size:30px;
color:white;
cursor:pointer;
">&times;</span>

<!-- tombol kiri -->
<span onclick="prevImg(event)" style="
position:absolute;
left:20px;
top:50%;
transform:translateY(-50%);
font-size:40px;
color:white;
cursor:pointer;
">&#10094;</span>

<!-- gambar -->
<img id="lightbox-img" style="
max-width:90vw;
max-height:90vh;
object-fit:contain;
border-radius:12px;
box-shadow:0 20px 60px rgba(0,0,0,0.7);
display:block;
margin:auto;
">

<!-- tombol kanan -->
<span onclick="nextImg(event)" style="
position:absolute;
right:20px;
top:50%;
transform:translateY(-50%);
font-size:40px;
color:white;
cursor:pointer;
">&#10095;</span>

</div>
<script>
let images = [
"pramuka1.jpg",
"pramuka2.jpg",
"pramuka3.jpg",
"pramuka4.jpg"
];

let currentIndex = 0;

function openImg(index){
 currentIndex = index;
 document.getElementById("lightbox").style.display = "flex";
 document.getElementById("lightbox-img").src = images[currentIndex];
}

function closeImg(){
 document.getElementById("lightbox").style.display = "none";
}

function nextImg(e){
 e.stopPropagation();
 currentIndex = (currentIndex + 1) % images.length;
 document.getElementById("lightbox-img").src = images[currentIndex];
}

function prevImg(e){
 e.stopPropagation();
 currentIndex = (currentIndex - 1 + images.length) % images.length;
 document.getElementById("lightbox-img").src = images[currentIndex];
}
</script>
