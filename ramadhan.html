<!DOCTYPE html>
<html>
<head>
<title>Kegiatan Ramadhan 2026</title>
</head>
<style>

body{
font-family:Arial, sans-serif;
margin:0;
background:#f5f7fa;
}

.container{
max-width:1200px;
margin:auto;
padding:40px 20px;
}

.title{
text-align:center;
color:#0d47a1;
margin-bottom:30px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit, minmax(250px,1fr));
gap:20px;
}

.grid img{
width:100%;
height:200px;
object-fit:cover;
border-radius:10px;
cursor:pointer;
transition:0.3s;
}

.grid img:hover{
transform:scale(1.05);
}

.lightbox{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
align-items:center;
justify-content:center;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:10px;
}

</style>
<body>
<div id="lightbox" onclick="closeImg()" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
z-index:999;
">
<img id="lightbox-img" style="max-width:90%;max-height:90%;border-radius:10px;">
</div>
<div class="container">

<h1 class="title">Kegiatan Ramadhan 2026</h1>

<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;">

<img src="ramadhan1.jpg" onclick="openImg(this)" style="width:100%;border-radius:10px;cursor:pointer;">
<img src="ramadhan2.jpg" onclick="openImg(this)" style="width:100%;border-radius:10px;cursor:pointer;">
<img src="ramadhan3.jpg" onclick="openImg(this)" style="width:100%;border-radius:10px;cursor:pointer;">
<img src="ramadhan4.jpg" onclick="openImg(this)" style="width:100%;border-radius:10px;cursor:pointer;">

</div>

<a href="galeri.html" style="display:block;text-align:center;margin-top:30px;">
← Kembali ke Galeri
</a>

</div>

<div id="lightbox" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
justify-content:center;
align-items:center;
">

<img id="lightbox-img" style="max-width:90%; max-height:90%; border-radius:10px;">

</div>

<script>
function openImg(img){
document.getElementById("lightbox").style.display = "flex";
document.getElementById("lightbox-img").src = img.src;
}

function closeImg(){
document.getElementById("lightbox").style.display = "none";
}
</script>
</body>
</html>
