  <style>

<style>
body{
  font-family:Arial;
  padding-top:100px;
  background:#f5f7fa;
}

.title{
  text-align:center;
  color:#0d47a1;
  margin-bottom:30px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:20px;
}

.card{
  background:white;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
  transition:0.3s;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.card img{
  width:100%;
  height:180px;
  object-fit:cover;
}

.card h3{
  padding:15px;
  margin:0;
  color:#0d47a1;
}

a{
  text-decoration:none;
  color:inherit;
}
</style>

</head>

<body style="padding-top:100px;">

<header style="
background:#0d47a1;
padding:15px 40px;
display:flex;
align-items:center;
justify-content:space-between;
position:fixed;
top:0;
left:0;
width:100%;
z-index:1000;
">

<div style="display:flex;align-items:center;gap:12px;">
<img src="logo.png" style="width:55px;">
<div>
<h2 style="color:white;margin:0;">SMP Negeri 2 Kresek</h2>
<small style="color:#cfd8ff;">Kabupaten Tangerang</small>
</div>
</div>

<nav style="display:flex;gap:25px;font-weight:bold;">
<a href="index.html" style="color:white;text-decoration:none;">Beranda</a>
<a href="index.html#profil" style="color:white;text-decoration:none;">Profil</a>
<a href="index.html#guru" style="color:white;text-decoration:none;">Guru</a>

</nav>

</header>

<h1 class="title">Kegiatan Ramadhan 2026</h1>

<div class="grid">

<img src="ramadhan1.jpg" class="fade-in" onclick="openImg(this.src)">
<img src="ramadhan2.jpg" class="fade-in" onclick="openImg(this.src)">
<img src="ramadhan3.jpg" class="fade-in" onclick="openImg(this.src)">
<img src="ramadhan4.jpg" class="fade-in" onclick="openImg(this.src)">

<div style="text-align:center; margin-top:40px;">
  <a href="kegiatan.html" style="
    display:inline-block;
    background:#0d47a1;
    color:white;
    padding:12px 25px;
    border-radius:25px;
    text-decoration:none;
    font-weight:bold;
  ">
    ← Kembali ke Kegiatan
  </a>
</div>
  
<div id="lightbox" onclick="closeImg()" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
z-index:9999;
">
<img id="lightbox-img" style="
width:auto;
height:auto;
max-width:95vw;
max-height:95vh;
object-fit:contain;
border-radius:12px;
box-shadow:0 20px 60px rgba(0,0,0,0.7);
display:block;
margin:auto;
">
<button onclick="prevImg(event)" style="
position:absolute;
left:20px;
top:50%;
transform:translateY(-50%);
font-size:40px;
background:none;
border:none;
color:white;
cursor:pointer;
">❮</button>

<button onclick="nextImg(event)" style="
position:absolute;
right:20px;
top:50%;
transform:translateY(-50%);
font-size:40px;
background:none;
border:none;
color:white;
cursor:pointer;
">❯</button>
</div>
<script>
let currentIndex = 0;
let images = document.querySelectorAll(".grid img");

function openImg(src){
 document.getElementById("lightbox").style.display = "flex";
 document.getElementById("lightbox-img").src = src;
}

function closeImg(){
 document.getElementById("lightbox").style.display = "none";
}

function nextImg(event){
  event.stopPropagation();
  currentIndex = (currentIndex + 1) % images.length;
  document.getElementById("lightbox-img").src = images[currentIndex].src;
}

function prevImg(event){
  event.stopPropagation();
  currentIndex = (currentIndex - 1 + images.length) % images.length;
  document.getElementById("lightbox-img").src = images[currentIndex].src;
}
</script>
</body>
</html>
